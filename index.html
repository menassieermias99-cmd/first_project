<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple to do list</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>What are the plans for Today</h1>
    </header>
    <main>
      <input type="text" placeholder="e.g. wash clothes, apply to jobs" />
      <button>Add</button>
      <div>
        <h2>Still to do</h2>
        <section id="to-do"></section>
        <h2>Done(wooo whooo)</h2>
        <section id="done"></section>
      </div>
    </main>
    <footer></footer>
    <script src="script.js"></script>
  </body>
</html>
